# 打 tag（v*）时自动构建 + 打包两个包的 tarball 并发布 GitHub Release。
# 用法：本地 git tag v0.1.0 && git push origin v0.1.0
# 消费方可直接 npm install <release 的 .tgz 地址>，无需 npm 官方托管。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FOX_VERSION="$(node -p "require('./packages/foxtone/package.json').version")"
          REACT_VERSION="$(node -p "require('./packages/foxtone-react/package.json').version")"
          if [ "$TAG" != "$FOX_VERSION" ] || [ "$TAG" != "$REACT_VERSION" ]; then
            echo "::error::版本不一致：tag=v${TAG}，foxtone=${FOX_VERSION}，foxtone-react=${REACT_VERSION}"
            exit 1
          fi
          echo "✓ tag v${TAG} 与 foxtone / foxtone-react 版本一致"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack tarballs
        run: |
          mkdir -p release
          pnpm --filter foxtone pack --pack-destination "$PWD/release"
          pnpm --filter foxtone-react pack --pack-destination "$PWD/release"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.tgz
